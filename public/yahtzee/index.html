<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yahtzee · Score Chalk</title>
<!-- visits, and errors on these pages: see /report.js -->
<script src="/report.js?v=1"></script>
<!-- Score Chalk as an app: installable, and working offline (see /pwa.js) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Score Chalk">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A Yahtzee scoresheet for up to ten players, bonuses and all, filled in together from every phone.">
<!-- the one address for this page: shared-game links (?s=) and the like fold into it -->
<link rel="canonical" href="https://scorechalk.com/yahtzee/">
<!-- the card a link shows in messages and posts; for a shared game's link the
     Worker fills in who is playing (see previewFor in worker/share.js) -->
<meta property="og:site_name" content="Score Chalk">
<meta property="og:type" content="website">
<meta property="og:url" content="https://scorechalk.com/yahtzee/">
<meta property="og:title" content="Yahtzee · Score Chalk">
<meta property="og:description" content="A Yahtzee scoresheet for up to ten players, bonuses and all, filled in together from every phone.">
<meta property="og:image" content="https://scorechalk.com/og/yahtzee.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<!-- ?v= must be bumped whenever a stylesheet or app.js changes, as in darts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Josefin+Sans:wght@400;600;700&family=Bree+Serif&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="../shared.css?v=40">
<!-- the room this game is played in (data-room on the body), with any
     adjustments of this game's own at the top of style.css -->
<link rel="stylesheet" href="../themes.css?v=7">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body data-room="living" data-game="yahtzee">

<!-- ============ SETUP ============ -->
<section id="setup" class="screen">
  <!-- home (the badge), and under it the way back to the list of every
       game, only for whoever has just come from there -->
  <nav class="crumbs" aria-label="Breadcrumb">
    <a class="backlink mark" href="/" aria-label="Home"><span class="arrow" aria-hidden="true">&lsaquo;</span><img src="/favicon.svg?v=2" alt="" width="30" height="30"></a>
    <a class="crumb" href="/games/" hidden>&lsaquo; All games</a>
  </nav>
  <script>try { const r = new URL(document.referrer); if (r.origin === location.origin && r.pathname === '/games/') document.querySelector('.crumb').hidden = false; } catch (e) {}</script>

  <header class="brand">
    <h1 class="room-title">Yahtzee</h1>
    <p>A scoresheet for one to ten players</p>
  </header>

  <div class="card">
    <div class="field">
      <span>Players</span>
      <div class="stepper">
        <button type="button" class="step" id="pMinus" aria-label="Fewer players">&minus;</button>
        <b id="pCount">2</b>
        <button type="button" class="step" id="pPlus" aria-label="More players">+</button>
      </div>
    </div>
    <!-- the order of the list is the order of play: each name has a grip
         to drag it by (see /roster.js; the .roster styles are in /shared.css) -->
    <ol id="names" class="roster"></ol>
  </div>

  <div class="card">
    <span class="field-label" style="color:var(--dim);font-size:14px">You are</span>
    <!-- taken for you when the game is shared, so no one else joins as you -->
    <div class="preset-row" id="youRow" style="flex-wrap:wrap"></div>
  </div>

  <button id="startBtn" class="primary big">Start Game</button>
  <button id="resumeBtn" class="ghost hidden">Resume saved game</button>
  <!-- the scoring guide for this game, which links back here -->
  <p class="guide-link"><a href="/yahtzee-score-sheet/">How the Yahtzee score sheet works</a></p>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen hidden">
  <!-- Everything has to fit one phone screen, so the game's own buttons
       share the top bar rather than taking a row of their own. -->
  <header class="topbar">
    <a class="backlink mark" href="/" aria-label="All games"><span class="arrow" aria-hidden="true">&lsaquo;</span><img src="/favicon.svg?v=2" alt="" width="30" height="30"></a>
    <h1 class="room-title">Yahtzee</h1>
    <div class="topbtns">
      <button id="undoBtn" class="tbtn">Undo</button>
      <button id="shareBtn" class="tbtn">Share</button>
      <button id="quitBtn" class="tbtn">New game</button>
      <!-- the score sheet's rules; the game is kept, and Back returns -->
      <a class="tbtn rules" href="/yahtzee-score-sheet/" aria-label="How the Yahtzee score sheet works">?</a>
    </div>
  </header>

  <!-- the scoresheet: built by buildSheet(), filled by render(); it fills
       the rest of the screen, the box rows sharing whatever height is left -->
  <!-- for whoever shared the game: score all players, or their own only -->
  <div class="sc-edit-slot"></div>
  <div class="sheet-wrap"><div class="sheet" id="sheet"></div></div>

</section>

<!-- ============ ENTRY ============ -->
<!-- scoring one box: what it offers depends on the box; see openEntry() -->
<div id="entryOverlay" class="overlay sheet-entry hidden">
  <!-- a slip of the room's paper -->
  <div class="entry-card paper plain" id="entryCard">
    <div class="entry-top">
      <div>
        <b id="entryTitle"></b>
        <small id="entryWho"></small>
      </div>
      <button class="entry-x" id="entryClose" aria-label="Close">×</button>
    </div>
    <p class="entry-hint" id="entryHint"></p>
    <div class="entry-body" id="entryBody"></div>
    <button class="ghost entry-empty hidden" id="entryEmpty">Empty this box</button>
  </div>
</div>

<!-- ============ CONFIRM ============ -->
<div id="confirmOverlay" class="overlay confirm hidden">
  <div class="win-card">
    <h2>Are you sure?</h2>
    <p id="confirmText"></p>
    <button id="confirmYes" class="danger big">Yes</button>
    <button id="confirmNo" class="ghost">Cancel</button>
  </div>
</div>

<!-- ============ WIN ============ -->
<div id="winOverlay" class="overlay hidden">
  <div class="win-card">
    <div class="trophy">🏆</div>
    <h2 id="winName"></h2>
    <ol id="winTable" class="standings"></ol>
    <p id="winSave" class="win-save"></p>
    <button id="rematchBtn" class="primary big">Rematch</button>
    <button id="keepBtn" class="ghost">Back to the sheet</button>
    <button id="newBtn" class="ghost">New setup</button>
  </div>
</div>

<script src="/account.js?v=29" defer></script>
<script src="/awake.js?v=1"></script>
<script src="/store.js?v=3"></script>
<script src="/share.js?v=12"></script>
<script src="/cloud.js?v=3"></script>
<script src="/roster.js?v=2"></script>
<script src="/editgame.js?v=1"></script>
<script src="app.js?v=23"></script>
<script src="/pwa.js?v=1" defer></script>
</body>
</html>
