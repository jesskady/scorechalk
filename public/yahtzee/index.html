<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yahtzee · Score Chalk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23182029'/><circle cx='16' cy='16' r='11' fill='%232e7d4f'/><circle cx='16' cy='16' r='7' fill='%23182029'/><circle cx='16' cy='16' r='3.5' fill='%23c0392b'/></svg>">
<!-- ?v= must be bumped whenever a stylesheet or app.js changes, as in darts -->
<link rel="stylesheet" href="../shared.css?v=29">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setup" class="screen">
  <a class="backlink" href="/">&lsaquo; All games</a>

  <header class="brand">
    <h1>Yahtzee</h1>
    <p>A scoresheet for one to six players</p>
  </header>

  <div class="card">
    <div class="field">
      <span>Players</span>
      <div class="stepper">
        <button type="button" class="step" id="pMinus" aria-label="Fewer players">&minus;</button>
        <b id="pCount">2</b>
        <button type="button" class="step" id="pPlus" aria-label="More players">+</button>
      </div>
    </div>
    <div id="names" class="names"></div>
  </div>

  <button id="startBtn" class="primary big">Start Game</button>
  <button id="resumeBtn" class="ghost hidden">Resume saved game</button>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen hidden">
  <header class="brand compact gamebar">
    <a class="backlink" href="/yahtzee/">&lsaquo; Back</a>
    <h1>Yahtzee</h1>
  </header>

  <!-- the scoresheet: built by buildSheet(), filled by render() -->
  <div class="sheet-wrap"><div class="sheet" id="sheet"></div></div>

  <p class="sheet-hint">Tap a player to see their open boxes. Tap a box to score it.</p>

  <div class="mini-row">
    <button id="undoBtn" class="ghost">Undo</button>
    <button id="quitBtn" class="ghost">New game</button>
  </div>

  <p id="msg" class="msg"></p>
</section>

<!-- ============ ENTRY ============ -->
<!-- scoring one box: what it offers depends on the box; see openEntry() -->
<div id="entryOverlay" class="overlay sheet-entry hidden">
  <div class="entry-card">
    <div class="entry-top">
      <div>
        <b id="entryTitle"></b>
        <small id="entryWho"></small>
      </div>
      <button class="entry-x" id="entryClose" aria-label="Close">×</button>
    </div>
    <p class="entry-hint" id="entryHint"></p>
    <div class="entry-body" id="entryBody"></div>
    <button class="ghost entry-empty hidden" id="entryEmpty">Empty this box</button>
  </div>
</div>

<!-- ============ CONFIRM ============ -->
<div id="confirmOverlay" class="overlay confirm hidden">
  <div class="win-card">
    <h2>Are you sure?</h2>
    <p id="confirmText"></p>
    <button id="confirmYes" class="danger big">Yes</button>
    <button id="confirmNo" class="ghost">Cancel</button>
  </div>
</div>

<!-- ============ WIN ============ -->
<div id="winOverlay" class="overlay hidden">
  <div class="win-card">
    <div class="trophy">🏆</div>
    <h2 id="winName"></h2>
    <ol id="winTable" class="standings"></ol>
    <p id="winSave" class="win-save"></p>
    <button id="rematchBtn" class="primary big">Rematch</button>
    <button id="keepBtn" class="ghost">Back to the sheet</button>
    <button id="newBtn" class="ghost">New setup</button>
  </div>
</div>

<script src="/account.js?v=29" defer></script>
<script src="app.js?v=2"></script>
</body>
</html>
