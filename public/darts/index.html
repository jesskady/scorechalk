<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Darts · Score Chalk</title>
<!-- visits, and errors on these pages: see /report.js -->
<script src="/report.js?v=1"></script>
<!-- Score Chalk as an app: installable, and working offline (see /pwa.js) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Score Chalk">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A darts scorekeeper: 501, 301 and more, double in and out, checkouts, and scoring together from every phone.">
<!-- the one address for this page: shared-game links (?s=) and the like fold into it -->
<link rel="canonical" href="https://scorechalk.com/darts/">
<!-- the card a link shows in messages and posts; for a shared game's link the
     Worker fills in who is playing (see previewFor in worker/share.js) -->
<meta property="og:site_name" content="Score Chalk">
<meta property="og:type" content="website">
<meta property="og:url" content="https://scorechalk.com/darts/">
<meta property="og:title" content="Darts · Score Chalk">
<meta property="og:description" content="A darts scorekeeper: 501, 301 and more, double in and out, checkouts, and scoring together from every phone.">
<meta property="og:image" content="https://scorechalk.com/og/darts.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<!-- ?v= must be bumped whenever a stylesheet or app.js changes. Each file is
     cached independently at the edge, so without this a new index.html can
     load against a stale app.js and misbehave. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Josefin+Sans:wght@400;600;700&family=Bree+Serif&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="../shared.css?v=42">
<!-- the room this game is played in: the Parlor (see /themes.css) -->
<link rel="stylesheet" href="../themes.css?v=7">
<link rel="stylesheet" href="style.css?v=36">
</head>
<body data-room="parlor" data-game="darts">

<!-- ============ SETUP ============ -->
<section id="setup" class="screen">
  <!-- a tournament's match leads back to the tournament instead (see prefill) -->
  <!-- home (the badge), and under it the way back to the list of every
       game, only for whoever has just come from there -->
  <nav class="crumbs" aria-label="Breadcrumb">
    <a class="backlink mark" id="setupBack" href="/" aria-label="Home"><span class="arrow" aria-hidden="true">&lsaquo;</span><img src="/favicon.svg?v=2" alt="" width="30" height="30"></a>
    <a class="crumb" href="/games/" hidden>&lsaquo; All games</a>
  </nav>
  <script>try { const r = new URL(document.referrer); if (r.origin === location.origin && r.pathname === '/games/') document.querySelector('.crumb').hidden = false; } catch (e) {}</script>

  <header class="brand">
    <h1 class="room-title">Darts</h1>
    <p id="setupSub">Countdown scoring for one to four players</p>
  </header>

  <!-- a round robin of darts: the tournament's setup, darts chosen -->
  <a class="tourney-link" id="tourneyLink" href="/tournament/?game=darts">
    <span aria-hidden="true">🏆</span><b>Run a darts tournament</b><i aria-hidden="true">›</i>
  </a>

  <div class="card">
    <span class="field-label">Mode</span>
    <!-- class is deliberately NOT .preset: the score presets below are swept
         by class, and these must never be caught by that -->
    <div class="preset-row" id="modeRow">
      <button class="seg" data-players="1">Practice</button>
      <button class="seg is-on" data-players="2">2 players</button>
      <button class="seg" data-players="3">3 players</button>
      <button class="seg" data-players="4">4 players</button>
    </div>
  </div>

  <div class="card">
    <!-- the order of the list is the order of throwing: each name gets a
         grip to drag it by (see /roster.js; .roster is in /shared.css) -->
    <ol class="roster" id="names">
      <li><i id="label1">1.</i><input id="name1" class="roster-name" type="text" placeholder="Player 1" autocomplete="off" maxlength="14" aria-label="Player 1's name"></li>
      <li id="field2"><i>2.</i><input id="name2" class="roster-name" type="text" placeholder="Player 2" autocomplete="off" maxlength="14" aria-label="Player 2's name"></li>
      <li class="hidden" id="field3"><i>3.</i><input id="name3" class="roster-name" type="text" placeholder="Player 3" autocomplete="off" maxlength="14" aria-label="Player 3's name"></li>
      <li class="hidden" id="field4"><i>4.</i><input id="name4" class="roster-name" type="text" placeholder="Player 4" autocomplete="off" maxlength="14" aria-label="Player 4's name"></li>
    </ol>

    <!-- Which player the account holder is. Statistics depend on it, so it is
         asked rather than guessed, and taken for you when the game is shared.
         Shown when playing against others; in practice mode there is only
         one player to be. -->
    <div class="field hidden" id="meRow">
      <span>You are</span>
      <div class="preset-row" id="meSel">
        <button class="seg is-on" type="button" data-me="0">Player 1</button>
        <button class="seg" type="button" data-me="1">Player 2</button>
        <button class="seg hidden" type="button" data-me="2">Player 3</button>
        <button class="seg hidden" type="button" data-me="3">Player 4</button>
      </div>
    </div>
  </div>

  <div class="card">
    <span class="field-label">Starting score</span>
    <div class="preset-row" id="presets">
      <button class="preset" data-score="301">301</button>
      <button class="preset is-on" data-score="501">501</button>
      <button class="preset" data-score="701">701</button>
    </div>
    <label class="field">
      <span>Custom</span>
      <input id="startScore" type="number" inputmode="numeric" value="501" min="2" max="9999">
    </label>
  </div>

  <div class="card">
    <button id="doubleIn" class="toggle" role="switch" aria-checked="false">
      <span class="tg-label">
        <b>Double in</b>
        <small>Nothing scores until you hit a double to open.</small>
      </span>
      <span class="tg-switch"></span>
    </button>
    <button id="doubleOut" class="toggle" role="switch" aria-checked="false">
      <span class="tg-label">
        <b>Double out</b>
        <small>Winning dart must be a double. Leaving 1 is a bust.</small>
      </span>
      <span class="tg-switch"></span>
    </button>
  </div>

  <button id="startBtn" class="primary big">Start Game</button>
  <button id="resumeBtn" class="ghost hidden">Resume saved game</button>
  <!-- unfinished games from the profile, filled in when signed in -->
  <div id="cloudResume" class="cloud-resume"></div>
  <!-- the scoring guide for this game, which links back here -->
  <p class="guide-link"><a href="/darts-scorer/">How darts scoring and checkouts work</a></p>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen hidden">

  <!-- Back to the darts setup rather than the chooser: starting another leg
       is the common reason to leave, and the chooser is one more tap from
       there. Navigating reloads the page, which is what rebuilds the setup
       screen with a current Resume button.

       Leaving mid-game is safe: the game stays in localStorage and is offered
       back as Resume, and Save puts it on the profile for other devices. -->
  <header class="brand compact gamebar">
    <a class="backlink mark" id="gameBack" href="/" aria-label="All games"><span class="arrow" aria-hidden="true">&lsaquo;</span><img src="/favicon.svg?v=2" alt="" width="30" height="30"></a>
    <h1 class="room-title">Darts</h1>
  </header>

  <div id="badges" class="badges hidden">
    <span id="bIn" class="badge hidden">Double in</span>
    <span id="bOut" class="badge hidden">Double out</span>
  </div>

  <div class="scoreboard" id="scoreboard">
    <button class="player" id="p0">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
    <button class="player" id="p1">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
    <button class="player hidden" id="p2">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
    <button class="player hidden" id="p3">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
  </div>

  <div class="turnbar">
    <div class="darts" id="dartSlots"></div>
    <div class="turntotal"><span id="turnTotal">0</span><small>this turn</small></div>
  </div>

  <!-- for whoever shared the game: score all players, or their own only -->
  <div class="sc-edit-slot"></div>
  <div id="checkout" class="checkout"></div>
  <!-- In the checkout's place, which is empty while either shows. A
       checkout is offered, not declared: End game ends it, and Undo takes it
       back if that wasn't the finish (see renderWinBar). -->
  <div class="win-bar hidden" id="winBar" aria-live="polite">
    <span id="winBarText"></span>
    <button id="winBarBtn" type="button">End game</button>
  </div>
  <!-- a turn already thrown being changed, from Edit's History: see fixTurn -->
  <div class="win-bar fix-bar hidden" id="fixBar" aria-live="polite">
    <span id="fixText"></span>
    <button id="fixCancel" type="button">Cancel</button>
  </div>

  <!-- Darts entry -->
  <div id="dartsPad" class="pad">
    <!-- multipliers sit beside the grid, not above it: a full-width row of
         them costs vertical space the submit button needs -->
    <div class="entry">
      <div class="mult-col" id="mults">
        <button class="mult is-on" data-m="1">Single</button>
        <button class="mult" data-m="2">Double</button>
        <button class="mult" data-m="3">Triple</button>
      </div>
      <div class="numgrid" id="numgrid"></div>
    </div>
    <div class="special-row">
      <button class="key special" data-bull="25">Bull 25</button>
      <button class="key special" data-miss="1">Miss</button>
      <button class="key special" id="undoDart">Undo dart</button>
    </div>
  </div>

  <div class="actions">
    <button id="submitBtn" class="primary big">Submit turn</button>
    <!-- Share: links to watch the game or score in it together (/share.js).
         It took the place of Save, now that every turn is saved. -->
    <div class="mini-row has-save" id="miniRow">
      <button id="undoTurn" class="ghost">Undo turn</button>
      <button id="bustBtn" class="ghost bust-btn">Bust</button>
      <button id="shareBtn" class="ghost">Share</button>
      <!-- the players' order and names, in a sheet of their own: see /editgame.js -->
      <button id="editBtn" class="ghost">Edit</button>
      <button id="quitBtn" class="ghost">New game</button>
    </div>
  </div>

  <p id="msg" class="msg"></p>
  <!-- the rules, for a question mid-game; the game is kept, and Back returns -->
  <p class="guide-link"><a href="/darts-scorer/">How darts scoring and checkouts work</a></p>
</section>

<!-- ============ CONFIRM ============ -->
<div id="confirmOverlay" class="overlay confirm hidden">
  <div class="win-card">
    <h2>Are you sure?</h2>
    <p id="confirmText"></p>
    <button id="confirmYes" class="danger big">Yes</button>
    <button id="confirmNo" class="ghost">Cancel</button>
  </div>
</div>

<!-- ============ WIN ============ -->
<div id="winOverlay" class="overlay hidden">
  <div class="win-card">
    <div class="trophy">🎯</div>
    <h2 id="winName"></h2>
    <p id="winStats"></p>
    <button id="rematchBtn" class="primary big">Rematch</button>
    <button id="newBtn" class="ghost">New setup</button>
  </div>
</div>

<script src="/account.js?v=29" defer></script>
<script src="/awake.js?v=1"></script>
<script src="/store.js?v=3"></script>
<script src="/share.js?v=12"></script>
<script src="/cloud.js?v=3"></script>
<script src="sync.js?v=32"></script>
<script src="/roster.js?v=2"></script>
<script src="/editgame.js?v=3"></script>
<script src="app.js?v=49"></script>
<script src="/pwa.js?v=1" defer></script>
</body>
</html>
