<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Darts · Score Chalk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23182029'/><circle cx='16' cy='16' r='11' fill='%232e7d4f'/><circle cx='16' cy='16' r='7' fill='%23182029'/><circle cx='16' cy='16' r='3.5' fill='%23c0392b'/></svg>">
<!-- ?v= must be bumped whenever a stylesheet or app.js changes. Each file is
     cached independently at the edge, so without this a new index.html can
     load against a stale app.js and misbehave. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Josefin+Sans:wght@400;600;700&family=Bree+Serif&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="../shared.css?v=29">
<!-- the room this game is played in: the Parlor (see /themes.css) -->
<link rel="stylesheet" href="../themes.css?v=6">
<link rel="stylesheet" href="style.css?v=31">
</head>
<body data-room="parlor" data-game="darts">

<!-- ============ SETUP ============ -->
<section id="setup" class="screen">
  <a class="backlink" href="/">&lsaquo; All games</a>

  <header class="brand">
    <h1 class="room-title">Darts</h1>
    <p>Countdown scoring for one to four players</p>
  </header>

  <div class="card">
    <span class="field-label">Mode</span>
    <!-- class is deliberately NOT .preset: the score presets below are swept
         by class, and these must never be caught by that -->
    <div class="preset-row" id="modeRow">
      <button class="seg" data-players="1">Practice</button>
      <button class="seg is-on" data-players="2">2 players</button>
      <button class="seg" data-players="3">3 players</button>
      <button class="seg" data-players="4">4 players</button>
    </div>
  </div>

  <div class="card">
    <label class="field">
      <span id="label1">Player 1</span>
      <input id="name1" type="text" placeholder="Player 1" autocomplete="off" maxlength="14">
    </label>
    <label class="field" id="field2">
      <span>Player 2</span>
      <input id="name2" type="text" placeholder="Player 2" autocomplete="off" maxlength="14">
    </label>
    <label class="field hidden" id="field3">
      <span>Player 3</span>
      <input id="name3" type="text" placeholder="Player 3" autocomplete="off" maxlength="14">
    </label>
    <label class="field hidden" id="field4">
      <span>Player 4</span>
      <input id="name4" type="text" placeholder="Player 4" autocomplete="off" maxlength="14">
    </label>

    <!-- Which player the account holder is. Statistics depend on it, so it is
         asked rather than guessed. Only shown when signed in and playing
         against others — there is nothing to record otherwise, and in practice
         mode there is only one player to be. -->
    <div class="field hidden" id="meRow">
      <span>You are</span>
      <div class="preset-row" id="meSel">
        <button class="seg is-on" type="button" data-me="0">Player 1</button>
        <button class="seg" type="button" data-me="1">Player 2</button>
        <button class="seg hidden" type="button" data-me="2">Player 3</button>
        <button class="seg hidden" type="button" data-me="3">Player 4</button>
      </div>
    </div>
  </div>

  <div class="card">
    <span class="field-label">Starting score</span>
    <div class="preset-row" id="presets">
      <button class="preset" data-score="301">301</button>
      <button class="preset is-on" data-score="501">501</button>
      <button class="preset" data-score="701">701</button>
    </div>
    <label class="field">
      <span>Custom</span>
      <input id="startScore" type="number" inputmode="numeric" value="501" min="2" max="9999">
    </label>
  </div>

  <div class="card">
    <button id="doubleIn" class="toggle" role="switch" aria-checked="false">
      <span class="tg-label">
        <b>Double in</b>
        <small>Nothing scores until you hit a double to open.</small>
      </span>
      <span class="tg-switch"></span>
    </button>
    <button id="doubleOut" class="toggle" role="switch" aria-checked="false">
      <span class="tg-label">
        <b>Double out</b>
        <small>Winning dart must be a double. Leaving 1 is a bust.</small>
      </span>
      <span class="tg-switch"></span>
    </button>
  </div>

  <button id="startBtn" class="primary big">Start Game</button>
  <button id="resumeBtn" class="ghost hidden">Resume saved game</button>
  <!-- unfinished games from the profile, filled in when signed in -->
  <div id="cloudResume" class="cloud-resume"></div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen hidden">

  <!-- Back to the darts setup rather than the chooser: starting another leg
       is the common reason to leave, and the chooser is one more tap from
       there. Navigating reloads the page, which is what rebuilds the setup
       screen with a current Resume button.

       Leaving mid-game is safe: the game stays in localStorage and is offered
       back as Resume, and Save puts it on the profile for other devices. -->
  <header class="brand compact gamebar">
    <a class="backlink" href="/">&lsaquo; All games</a>
    <h1 class="room-title">Darts</h1>
  </header>

  <div id="badges" class="badges hidden">
    <span id="bIn" class="badge hidden">Double in</span>
    <span id="bOut" class="badge hidden">Double out</span>
  </div>

  <div class="scoreboard" id="scoreboard">
    <button class="player" id="p0">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
    <button class="player" id="p1">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
    <button class="player hidden" id="p2">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
    <button class="player hidden" id="p3">
      <span class="pname"></span>
      <span class="pscore"><b class="pnum"></b><i class="ppend"></i></span>
      <span class="pmeta"></span>
    </button>
  </div>

  <div class="turnbar">
    <div class="darts" id="dartSlots"></div>
    <div class="turntotal"><span id="turnTotal">0</span><small>this turn</small></div>
  </div>

  <div id="checkout" class="checkout"></div>

  <!-- Darts entry -->
  <div id="dartsPad" class="pad">
    <!-- multipliers sit beside the grid, not above it: a full-width row of
         them costs vertical space the submit button needs -->
    <div class="entry">
      <div class="mult-col" id="mults">
        <button class="mult is-on" data-m="1">Single</button>
        <button class="mult" data-m="2">Double</button>
        <button class="mult" data-m="3">Triple</button>
      </div>
      <div class="numgrid" id="numgrid"></div>
    </div>
    <div class="special-row">
      <button class="key special" data-bull="25">Bull 25</button>
      <button class="key special" data-miss="1">Miss</button>
      <button class="key special" id="undoDart">Undo dart</button>
    </div>
  </div>

  <div class="actions">
    <button id="submitBtn" class="primary big">Submit turn</button>
    <!-- Share: links to watch the game or score in it together (/share.js).
         It took the place of Save, now that every turn is saved. -->
    <div class="mini-row has-save" id="miniRow">
      <button id="undoTurn" class="ghost">Undo turn</button>
      <button id="bustBtn" class="ghost bust-btn">Bust</button>
      <button id="shareBtn" class="ghost">Share</button>
      <button id="quitBtn" class="ghost">New game</button>
    </div>
  </div>

  <p id="msg" class="msg"></p>
</section>

<!-- ============ CONFIRM ============ -->
<div id="confirmOverlay" class="overlay confirm hidden">
  <div class="win-card">
    <h2>Are you sure?</h2>
    <p id="confirmText"></p>
    <button id="confirmYes" class="danger big">Yes</button>
    <button id="confirmNo" class="ghost">Cancel</button>
  </div>
</div>

<!-- ============ WIN ============ -->
<div id="winOverlay" class="overlay hidden">
  <div class="win-card">
    <div class="trophy">🎯</div>
    <h2 id="winName"></h2>
    <p id="winStats"></p>
    <button id="rematchBtn" class="primary big">Rematch</button>
    <button id="newBtn" class="ghost">New setup</button>
  </div>
</div>

<script src="/account.js?v=29" defer></script>
<script src="/store.js?v=3"></script>
<script src="/share.js?v=2"></script>
<script src="/cloud.js?v=3"></script>
<script src="sync.js?v=31"></script>
<script src="app.js?v=36"></script>
</body>
</html>
